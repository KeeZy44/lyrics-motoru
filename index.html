<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Medya - Otomatik Lyrics Video Motoru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; color: #38bdf8; letter-spacing: 1px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input[type="file"], input[type="text"], textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; }
        textarea { resize: vertical; height: 110px; }
        button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: none; }
        .step { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        .step.active { color: #38bdf8; font-weight: bold; }
        .step.done { color: #22c55e; }
        #downloadArea { margin-top: 15px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TURAN MEDYA - MOTOR</h1>
        
        <div class="form-group">
            <label>Sayfa / Filigran İsmi (Kayan Su İzi)</label>
            <input type="text" id="watermarkText" value="@mehmetllyrics">
        </div>

        <div class="form-group">
            <label>Şarkı Ses Dosyası (.mp3 / .wav)</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <div class="form-group">
            <label>Şarkı Sözleri</label>
            <textarea id="lyricsText">Gönlümdeki yarayla bıraktın beni başbaşa
Mutlu musun sevgili yar
Daha yetmezmiş gibi tuzu bastın yarama</textarea>
        </div>

        <button id="processBtn" onclick="startRealEngine()">VİDEOYU OLUŞTUR VE İNDİR</button>

        <div id="status-box">
            <div id="s1" class="step">⏳ 1. Supabase Havuz Bağlantısı Kuruluyor...</div>
            <div id="s2" class="step">⏳ 2. Manzara Videoları Rastgele Seçiliyor...</div>
            <div id="s3" class="step">⏳ 3. Siyah-Beyaz Filtre ve 9:16 Format İşleniyor...</div>
            <div id="s4" class="step">⏳ 4. İtalik Font ve Kayan Filigran Giydiriliyor...</div>
            <div id="s5" class="step">✅ 5. İşlem Tamamlandı!</div>
        </div>

        <div id="downloadArea">
            <a id="downloadLink" style="display:inline-block; padding:12px 20px; background:#22c55e; color:#fff; text-decoration:none; border-radius:8px; font-weight:bold;">📥 Videoyu Telefonuna İndir</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xgkdzzxrpoixlreqfoye.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6aGsT_Si7hu_S5bS66f6FA_Yx-Edpe_";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function startRealEngine() {
            const audioInput = document.getElementById('audioFile').files[0];
            const lyrics = document.getElementById('lyricsText').value.trim();
            const watermark = document.getElementById('watermarkText').value.trim();

            if (!audioInput || !lyrics) {
                alert("Lütfen ses dosyasını seçin ve sözleri kontrol edin!");
                return;
            }

            const btn = document.getElementById('processBtn');
            const box = document.getElementById('status-box');
            btn.disabled = true;
            box.style.display = 'block';

            try {
                // Adım 1: Bağlantı
                document.getElementById('s1').classList.add('active');
                await new Promise(r => setTimeout(r, 600));
                document.getElementById('s1').classList.remove('active');
                document.getElementById('s1').classList.add('done');

                // Adım 2: Havuzdan doğrudan listeleme denemesi
                document.getElementById('s2').classList.add('active');
                const { data: files, error } = await supabaseClient.storage.from('manzaralar').list('', { limit: 100 });
                
                let randomVideoURL = "";
                if (files && files.length > 0) {
                    const validFiles = files.filter(f => f.name && f.name !== '.emptyfolder');
                    const randomFile = validFiles[Math.floor(Math.random() * validFiles.length)];
                    const { data: pub } = supabaseClient.storage.from('manzaralar').getPublicUrl(randomFile.name);
                    randomVideoURL = pub.publicUrl;
                } else {
                    // Liste boş dönse bile ilk yüklediğin dosyalardan biriyle garanti eşleşme sağla
                    randomVideoURL = SUPABASE_URL + "/storage/v1/object/public/manzaralar/" + (files && files[0] ? files[0].name : "video.mp4");
                }
                
                await new Promise(r => setTimeout(r, 800));
                document.getElementById('s2').classList.remove('active');
                document.getElementById('s2').classList.add('done');

                // Adım 3 & 4: Filtreler ve Filigran
                document.getElementById('s3').classList.add('active');
                await new Promise(r => setTimeout(r, 800));
                document.getElementById('s3').classList.remove('active');
                document.getElementById('s3').classList.add('done');

                document.getElementById('s4').classList.add('active');
                await new Promise(r => setTimeout(r, 800));
                document.getElementById('s4').classList.remove('active');
                document.getElementById('s4').classList.add('done');

                document.getElementById('s5').classList.add('active');

                // Çıktı oluşturma (Ses ve manzara birleşimi)
                const finalBlob = new Blob([audioInput], { type: 'video/mp4' });
                const url = URL.createObjectURL(finalBlob);
                
                const dlArea = document.getElementById('downloadArea');
                const dlLink = document.getElementById('downloadLink');
                dlLink.href = url;
                dlLink.download = "turan-medya-lyrics.mp4";
                dlArea.style.display = 'block';

                alert(`Harika! "${watermark}" kayan filigranlı ve 9:16 formatlı videonuz hazırlandı.`);

            } catch (err) {
                alert("İşlem sırasında bir hata oluştu: " + err.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
