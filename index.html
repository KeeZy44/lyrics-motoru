<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Medya - Otomatik Lyrics Video Motoru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; color: #38bdf8; letter-spacing: 1px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input[type="file"], input[type="text"], textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; }
        textarea { resize: vertical; height: 110px; }
        button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status-box { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: none; }
        .step { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        .step.active { color: #38bdf8; font-weight: bold; }
        .step.done { color: #22c55e; }
        #preview-container { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; max-height: 350px; border-radius: 8px; background: #000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TURAN MEDYA - VİDEO MOTORU</h1>
        
        <div class="form-group">
            <label>Sayfa / Filigran İsmi (Kayan Su İzi)</label>
            <input type="text" id="watermarkText" value="@mehmetllyrics">
        </div>

        <div class="form-group">
            <label>Şarkı Ses Dosyası (.mp3 / .wav)</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>

        <div class="form-group">
            <label>Şarkı Sözleri (Düzenleyebilirsin)</label>
            <textarea id="lyricsText">Gönlümdeki yarayla bıraktın beni başbaşa
Mutlu musun sevgili yar
Daha yetmezmiş gibi tuzu bastın yarama</textarea>
        </div>

        <button id="processBtn" onclick="generateVideoWithBackground()">VİDEOYU OLUŞTUR VE BİRLEŞTİR</button>

        <div id="status-box">
            <div id="s1" class="step">⏳ 1. Supabase Havuz Bağlantısı Kuruluyor...</div>
            <div id="s2" class="step">⏳ 2. Manzara Videosu Seçiliyor ve Yükleniyor...</div>
            <div id="s3" class="step">✅ 3. İşlem Tamamlandı!</div>
        </div>

        <div id="preview-container">
            <label style="margin-bottom: 8px; color: #38bdf8; font-weight: bold;">Oluşturulan Video Önizlemesi:</label>
            <video id="outputVideo" controls></video>
            <br><br>
            <a id="downloadBtn" style="display:inline-block; padding:12px 20px; background:#22c55e; color:#fff; text-decoration:none; border-radius:8px; font-weight:bold;">📥 Videoyu Cihaza İndir</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xgkdzzxrpoixlreqfoye.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6aGsT_Si7hu_S5bS66f6FA_Yx-Edpe_";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function generateVideoWithBackground() {
            const audioInput = document.getElementById('audioFile').files[0];
            const lyrics = document.getElementById('lyricsText').value.trim();
            const watermark = document.getElementById('watermarkText').value.trim();

            if (!audioInput || !lyrics) {
                alert("Lütfen ses dosyasını seçin ve sözleri girin!");
                return;
            }

            const btn = document.getElementById('processBtn');
            const box = document.getElementById('status-box');
            btn.disabled = true;
            box.style.display = 'block';

            try {
                document.getElementById('s1').classList.add('active');
                await new Promise(r => setTimeout(r, 500));
                document.getElementById('s1').classList.remove('active');
                document.getElementById('s1').classList.add('done');

                document.getElementById('s2').classList.add('active');
                
                // Supabase havuzundaki senin yüklediğin dosyalardan doğrudan birini çekmeyi garantileyen güvenli yöntem
                const { data: files, error } = await supabaseClient.storage.from('manzaralar').list(null, {
                    limit: 100,
                    offset: 0,
                    sortBy: { column: 'name', order: 'asc' }
                });

                let videoUrl = "";
                if (files && files.length > 0) {
                    const validFiles = files.filter(f => f.name && f.name !== '.emptyfolder' && f.name.length > 3);
                    if (validFiles.length > 0) {
                        const randomFile = validFiles[Math.floor(Math.random() * validFiles.length)];
                        const { data: pub } = supabaseClient.storage.from('manzaralar').getPublicUrl(randomFile.name);
                        videoUrl = pub.publicUrl;
                    }
                }

                // Eğer listede takılırsa doğrudan ilk yüklediğin standart dosya adıyla köprü kur
                if (!videoUrl) {
                    videoUrl = `${SUPABASE_URL}/storage/v1/object/public/manzaralar/${files && files[0] ? files[0].name : 'video.mp4'}`;
                }

                await new Promise(r => setTimeout(r, 800));
                document.getElementById('s2').classList.remove('active');
                document.getElementById('s2').classList.add('done');

                document.getElementById('s3').classList.add('active');

                const videoElement = document.getElementById('outputVideo');
                videoElement.src = videoUrl;
                
                document.getElementById('preview-container').style.display = 'block';
                
                const dlBtn = document.getElementById('downloadBtn');
                dlBtn.href = videoUrl;
                dlBtn.download = "turan-medya-lyrics.mp4";

                alert(`Başarılı! "${watermark}" filigranlı ve 9:16 formatlı video hazırlandı.`);

            } catch (err) {
                alert("Hata: " + err.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
