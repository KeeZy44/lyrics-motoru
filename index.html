<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Medya - Çoklu Sahne Lyrics Motoru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 18px; margin-bottom: 15px; text-align: center; color: #38bdf8; letter-spacing: 1px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #94a3b8; }
        input[type="file"], input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 13px; }
        textarea { resize: vertical; height: 90px; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #preview-box { margin-top: 15px; display: none; text-align: center; position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 9/16; max-height: 420px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-style: italic; font-size: 22px; font-weight: bold; text-align: center; width: 85%; text-shadow: 0 2px 10px rgba(0,0,0,0.9); z-index: 10; transition: opacity 0.5s ease; }
        .watermark { position: absolute; bottom: 20px; left: 20px; color: rgba(255, 255, 255, 0.4); font-size: 14px; font-weight: bold; z-index: 10; animation: moveWatermark 6s ease-in-out infinite alternate; }
        @keyframes moveWatermark {
            0% { bottom: 20px; left: 20px; opacity: 0.3; }
            100% { top: 20px; right: 20px; left: auto; bottom: auto; opacity: 0.6; }
        }
        #info-bar { margin-top: 10px; text-align: center; font-size: 13px; color: #38bdf8; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TURAN MEDYA - ÇOKLU SAHNE MOTORU</h1>
        
        <div class="form-group">
            <label>Kayan Filigran / Sayfa İsmi</label>
            <input type="text" id="watermarkText" value="@mehmetllyrics">
        </div>

        <div class="form-group">
            <label>Her Bir Cümlenin Ekranda Kalma Süresi (Saniye)</label>
            <input type="number" id="slideDuration" value="3" min="1" max="10">
        </div>

        <div class="form-group">
            <label>Şarkı Sözleri (Her satırda farklı bir manzara videosu oynar)</label>
            <textarea id="lyricsText">Gönlümdeki yarayla bıraktın beni başbaşa
Mutlu musun sevgili yar
Daha yetmezmiş gibi tuzu bastın yarama
Unutulur mu sandın bu yaşananlar</textarea>
        </div>

        <button id="processBtn" onclick="startMultiSceneEngine()">KLİPİ OYNAT VE BAŞLAT</button>

        <div id="info-bar">Sahne: <span id="currentSceneNum">1</span> / <span id="totalSceneNum">0</span></div>

        <div id="preview-box">
            <video id="sceneVideo" autoplay muted playsinline></video>
            <div id="lyricsDisplay" class="overlay-text">Sözler yükleniyor...</div>
            <div id="watermarkDisplay" class="watermark">@mehmetllyrics</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xgkdzzxrpoixlreqfoye.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6aGsT_Si7hu_S5bS66f6FA_Yx-Edpe_";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeTimer = null;

        async function startMultiSceneEngine() {
            const rawLyrics = document.getElementById('lyricsText').value.trim();
            const watermark = document.getElementById('watermarkText').value.trim();
            const durationPerSlide = parseInt(document.getElementById('slideDuration').value) * 1000;

            if (!rawLyrics) {
                alert("Lütfen şarkı sözlerini satır satır girin!");
                return;
            }

            const lines = rawLyrics.split('\n').filter(l => l.trim() !== "");
            if (lines.length === 0) {
                alert("Geçerli satır bulunamadı!");
                return;
            }

            const btn = document.getElementById('processBtn');
            btn.disabled = true;
            btn.innerText = "Manzara Havuzu Taranıyor...";

            try {
                // Supabase havuzundaki tüm videoları çek
                const { data: files, error } = await supabaseClient.storage.from('manzaralar').list('', { limit: 100 });
                
                if (error || !files || files.length === 0) {
                    throw new Error("Supabase 'manzaralar' klasöründe video bulunamadı!");
                }

                const videoFiles = files.filter(f => f.name && f.name !== '.emptyfolder' && f.name.includes('.'));
                if (videoFiles.length === 0) throw new Error("Klasörde geçerli video yok!");

                // Her satır için havuzdan rastgele video URL'leri hazırla
                let sceneData = lines.map(line => {
                    const randomFile = videoFiles[Math.floor(Math.random() * videoFiles.length)];
                    const { data: pub } = supabaseClient.storage.from('manzaralar').getPublicUrl(randomFile.name);
                    return { text: line, videoUrl: pub.publicUrl };
                });

                document.getElementById('preview-box').style.display = 'block';
                document.getElementById('info-bar').style.display = 'block';
                document.getElementById('totalSceneNum').innerText = sceneData.length;

                let currentIndex = 0;
                const videoEl = document.getElementById('sceneVideo');
                const textEl = document.getElementById('lyricsDisplay');
                const watermarkEl = document.getElementById('watermarkDisplay');
                
                watermarkEl.innerText = watermark;

                if (activeTimer) clearInterval(activeTimer);

                function playNextScene() {
                    if (currentIndex >= sceneData.length) {
                        currentIndex = 0; // Döngüye sokmak istersen baştan başlatır
                    }

                    const currentScene = sceneData[currentIndex];
                    
                    // Videoyu ve yazıyı güncelle
                    videoEl.src = currentScene.videoUrl;
                    videoEl.play().catch(e => console.log("Oynatma hatası:", e));
                    
                    textEl.style.opacity = 0;
                    setTimeout(() => {
                        textEl.innerText = currentScene.text;
                        textEl.style.opacity = 1;
                    }, 250);

                    document.getElementById('currentSceneNum').innerText = currentIndex + 1;
                    currentIndex++;
                }

                // İlk sahneyi hemen oynat
                playNextScene();

                // Belirttiğin süreye göre sahneleri değiştir
                activeTimer = setInterval(playNextScene, durationPerSlide);

                btn.innerText = "KLİPİ OYNAT VE BAŞLAT";
                btn.disabled = false;

            } catch (err) {
                alert("Hata: " + err.message);
                btn.disabled = false;
                btn.innerText = "KLİPİ OYNAT VE BAŞLAT";
            }
        }
    </script>
</body>
</html>
